.play:after{content:"";position:absolute;left:38%;top:27%;border-style:solid;border-width:min(21px,4.2vw) 0 min(21px,4.2vw) min(34px,6.8vw);border-color:transparent transparent transparent #fff;filter:drop-shadow(0 3px 0 #c47f00)}
.play:active{transform:scale(.92)}
@keyframes pp{50%{transform:scale(1.07)}}
.pt{font:700 20px var(--px);color:#fff;text-align:center;letter-spacing:5px;text-shadow:0 3px 0 #2a8fe0,0 5px 8px rgba(31,42,90,.3);margin:6px 0 10px}

#ctx{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);display:none}

#joy{position:fixed;left:3vw;bottom:5vh;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.3);border:4px solid rgba(255,255,255,.85);display:none}

/* ---------- Rotate warning ---------- */
#rot{position:fixed;inset:0;background:linear-gradient(var(--bg1),var(--bg3));color:var(--d);font:700 20px var(--px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:99;text-align:center;line-height:1.6}

@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.panel,.panel *,.box,.box *{touch-action:pan-y}
.panel input[type=range],.box input[type=range]{touch-action:pan-x}
#nolib{position:fixed;inset:0;background:#fff;color:var(--d);font:700 18px var(--px);display:flex;align-items:center;justify-content:center;text-align:center;line-height:2;padding:20px;z-index:100}
/* ---------- Fade transitions ---------- */
#fade{position:fixed;inset:0;background:#070b2a;opacity:0;pointer-events:none;transition:opacity .35s;z-index:90}
#fade.on{opacity:1}
